name: Release

# Releases are tag-driven: pushing a vX.Y.Z tag is the only thing that ships.
# Merging to main does not release. See CONTRIBUTING "Releases (tag-based)".

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    name: tag-driven release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Assert tag matches plugin.json version
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          PLUGIN_VERSION="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "$PLUGIN_VERSION" != "$VER" ]; then
            echo "::error::tag v$VER does not match plugin.json version $PLUGIN_VERSION"
            exit 1
          fi
          echo "tag v$VER matches plugin.json $PLUGIN_VERSION"

      # Lint runs before the notes are extracted: release-notes.md is written
      # into the repo root, and the lint would otherwise sweep it (e.g. a
      # CHANGELOG entry quoting an unpinned OpenSpec invocation fails Check 1).
      - name: Re-check lint
        run: node scripts/lint.mjs

      # Same gate as ci.yml's validate job, so a tag cannot publish on red specs.
      - name: Re-check openspec validate
        run: npx --yes @fission-ai/openspec@1.9.0 validate --all --strict

      - name: Extract CHANGELOG notes for this version
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VER;
            const body = fs.readFileSync("CHANGELOG.md", "utf8");
            const parts = body.split(/\n## \[/);
            const sec = parts.find(p => p.startsWith(v + "]"));
            if (!sec) {
              console.error(`::error::CHANGELOG.md has no "## [${v}]" section`);
              process.exit(1);
            }
            const notes = sec.slice(sec.indexOf("\n") + 1).trim();
            fs.writeFileSync("release-notes.md", notes + "\n");
            console.log(notes);
          '

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  # Asks the marketplace repo to open a PR bumping the qrspi pin to this tag
  # (its `Bump plugin pin` workflow). A separate job with continue-on-error, so
  # a failure here can never red an already-published release. Needs the
  # MARKETPLACE_DISPATCH_TOKEN secret: a token with Contents read/write on
  # lotea-be/ai-agent-marketplace. Without it the job only prints a notice.
  notify-marketplace:
    name: notify marketplace
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Send plugin-release dispatch
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::MARKETPLACE_DISPATCH_TOKEN not set; bump the marketplace pin with /qrspi-marketplace-bump ${TAG#v}"
            exit 0
          fi
          gh api repos/lotea-be/ai-agent-marketplace/dispatches \
            -f event_type=plugin-release \
            -f "client_payload[plugin]=qrspi" \
            -f "client_payload[version]=${TAG#v}"
          echo "Dispatched plugin-release for qrspi ${TAG}; the marketplace opens the bump PR."
